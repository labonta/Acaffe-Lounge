<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Проверка адаптивности Acaffe Lounge</title><style>body{margin:0;background:#e2d8c4;font:14px Arial,sans-serif}header{padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}select{padding:8px;font:inherit}#stage{margin:0 auto;overflow:hidden}iframe{display:block;background:#fff4dc;border:0;transform-origin:top left}a{color:#29130f}</style></head><body><header><label for="size">Ширина экрана</label><select id="size"><option value="2560">2560 пикселей — широкий монитор</option><option value="1920">1920 пикселей — компьютер</option><option value="1440">1440 пикселей — компьютер</option><option value="768">768 пикселей — планшет</option><option value="375">375 пикселей — телефон</option></select><span>Локальная проверка макета</span><a href="../index.html">Открыть сайт</a></header><div id="stage"><iframe id="preview" src="../index.html" title="Сайт Acaffe Lounge"></iframe></div><script>
const select=document.querySelector('#size');const frame=document.querySelector('#preview');const stage=document.querySelector('#stage');
let fullPage=false;
function resize(){const width=Number(select.value);const scale=Math.min(fullPage ? 0.5 : 1,(innerWidth-32)/width);const height=fullPage?frame.contentDocument.documentElement.scrollHeight:(Number(select.value)===375?812:1000);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';stage.style.width=(width*scale)+'px';stage.style.height=(height*scale)+'px';}
select.addEventListener('change',()=>{fullPage=false;resize();});addEventListener('resize',resize);resize();
frame.addEventListener('load',()=>{const full=document.createElement('button');full.textContent='Вся страница';full.type='button';full.addEventListener('click',()=>{fullPage=true;resize();});document.querySelector('header').append(full);});
</script></body></html>
